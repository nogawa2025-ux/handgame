<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ハンドボール">
  <title>ハンドボール対戦</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="scoreboard"><span id="score-text"></span><span id="clock"></span></div>
    <div id="charge"><div id="charge-fill"></div></div>
    <div id="stamina"></div>
    <div id="passive" class="hidden">✋ パッシブ</div>
    <div id="banner" class="hidden"></div>
  </div>

  <div id="controls" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <button class="btn" id="btn-shoot" data-btn="shoot">シュート</button>
    <button class="btn" id="btn-pass" data-btn="pass">パス</button>
    <button class="btn" id="btn-long" data-btn="long">ロング</button>
    <button class="btn" id="btn-dash" data-btn="dash">ダッシュ</button>
    <button class="btn" id="btn-sub" data-btn="sub">交代</button>
  </div>

  <div id="screen" class="overlay"></div>

  <div id="rotate" class="overlay">
    <div class="rotate-box"><div class="phone-icon"></div><p>横にしてください</p></div>
  </div>

  <div id="loading" class="overlay hidden"><p>読み込み中…</p></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
