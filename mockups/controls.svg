<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <!-- phone frame (landscape) -->
  <rect x="5" y="5" width="890" height="410" rx="40" fill="#111"/>
  <rect x="30" y="20" width="840" height="380" rx="20" fill="#2a7a3b"/>
  <!-- court -->
  <rect x="70" y="60" width="760" height="300" fill="#3c9c50" stroke="#fff" stroke-width="3"/>
  <line x1="450" y1="60" x2="450" y2="360" stroke="#fff" stroke-width="3"/>
  <!-- 6m areas -->
  <path d="M70 120 A100 100 0 0 1 70 300" fill="#4aa8d8" stroke="#fff" stroke-width="3" transform="translate(0,0)"/>
  <path d="M70 110 Q190 210 70 310" fill="#5bb6e0" stroke="#fff" stroke-width="3"/>
  <path d="M830 110 Q710 210 830 310" fill="#5bb6e0" stroke="#fff" stroke-width="3"/>
  <path d="M70 90 Q240 210 70 330" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M830 90 Q660 210 830 330" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="58" y="180" width="12" height="60" fill="#fff"/>
  <rect x="830" y="180" width="12" height="60" fill="#fff"/>
  <!-- my team (blue) -->
  <g fill="#2a5bd7" stroke="#fff" stroke-width="2">
    <circle cx="100" cy="210" r="11"/>
    <circle cx="380" cy="120" r="11"/><circle cx="420" cy="300" r="11"/>
    <circle cx="560" cy="150" r="11"/><circle cx="600" cy="270" r="11"/>
    <circle cx="650" cy="90" r="11"/>
  </g>
  <!-- controlled player -->
  <circle cx="500" cy="210" r="13" fill="#2a5bd7" stroke="#ffe600" stroke-width="4"/>
  <polygon points="500,186 492,174 508,174" fill="#ffe600"/>
  <circle cx="514" cy="214" r="6" fill="#ffb000" stroke="#000" stroke-width="1"/>
  <!-- opponents (red) -->
  <g fill="#d33" stroke="#fff" stroke-width="2">
    <circle cx="800" cy="210" r="11"/>
    <circle cx="700" cy="140" r="11"/><circle cx="720" cy="200" r="11"/><circle cx="700" cy="270" r="11"/>
    <circle cx="660" cy="320" r="11"/><circle cx="640" cy="200" r="11"/>
  </g>
  <!-- pass guide -->
  <line x1="514" y1="214" x2="600" y2="270" stroke="#ffe600" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- HUD -->
  <rect x="340" y="26" width="220" height="30" rx="8" fill="#000a"/>
  <text x="450" y="47" fill="#fff" font-size="18" text-anchor="middle" font-weight="bold">あなた 12 - 10 友人　3:24</text>
  <!-- joystick -->
  <circle cx="140" cy="320" r="60" fill="#fff3" stroke="#fffa" stroke-width="3"/>
  <circle cx="165" cy="305" r="26" fill="#fffc"/>
  <text x="140" y="398" fill="#fff" font-size="13" text-anchor="middle">移動スティック</text>
  <!-- buttons -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="790" cy="320" r="38" fill="#e53935cc" stroke="#fff" stroke-width="2"/><text x="790" y="326">シュート</text>
    <circle cx="710" cy="345" r="32" fill="#1e88e5cc" stroke="#fff" stroke-width="2"/><text x="710" y="351">パス</text>
    <circle cx="730" cy="268" r="28" fill="#43a047cc" stroke="#fff" stroke-width="2"/><text x="730" y="273" font-size="13">ロング</text>
    <circle cx="805" cy="240" r="26" fill="#fb8c00cc" stroke="#fff" stroke-width="2"/><text x="805" y="245" font-size="13">ダッシュ</text>
  </g>
  <text x="755" y="398" fill="#fff" font-size="12" text-anchor="middle">守備時：パス→選手切替 / シュート→カット</text>
</svg>
